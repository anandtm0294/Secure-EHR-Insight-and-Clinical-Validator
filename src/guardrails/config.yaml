models:
  - type: main
    engine: openai
    model: openai/gpt-oss-20b
    mode: chat
    api_key_env_var: GROQ_API_KEY
    parameters:
      base_url: https://api.groq.com/openai/v1
      temperature: 0.2
      max_tokens: 2048

  - type: embeddings
    engine: SentenceTransformers
    model: NeuML/bioclinical-modernbert-base-embeddings
    parameters:
      local_files_only: true
